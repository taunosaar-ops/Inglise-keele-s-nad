    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            background: #fff;
        }
        h1 { text-align: center; color: #2c3e50; }
        .menu, .game { margin-top: 20px; }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 15px;
            margin: 6px 0;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
        }
        button:hover { background-color: #2980b9; }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
        }
        .hidden { display: none; }
        #stats { font-weight: bold; margin-bottom: 15px; color: #555; }
        #feedback { font-weight: bold; margin-top: 10px; font-size: 18px; }
    </style>
</head>
<body>

    <h1>🇬🇧 Inglise-Eesti Sõnade Testija 🇪🇪</h1>

    <!-- Menüü -->
    <div id="menu-screen" class="menu">
        <p>Vali raamat:</p>
        <button onclick="startTest('book1')">Book 1 (Units 1–15)</button>
        <button onclick="startTest('book2')">Book 2 (Units 1–20)</button>
        <button onclick="startTest('all')">Kõik raamatud ja unitid koos</button>
    </div>

    <!-- Mängu vaade -->
    <div id="game-screen" class="game hidden">
        <div id="stats">Punkte: <span id="score">0</span> | Küsimusi: <span id="total">0</span></div>
        <p id="question-text" style="font-size: 20px; font-weight: bold;"></p>
        <input type="text" id="user-answer" placeholder="Kirjuta eesti keeles..." autocomplete="off">
        <button onclick="checkAnswer()">Vasta</button>
        <button onclick="endTest()" style="background-color: #e74c3c;">Lõpeta / Välju</button>
        <p id="feedback"></p>
    </div>

    <!-- Tulemuste vaade -->
    <div id="result-screen" class="menu hidden">
        <h2>Test on lõppenud!</h2>
        <p id="final-stats" style="font-size: 18px;"></p>
        <button onclick="location.reload()">Proovi uuesti</button>

            },
            book1: {
                1: {"Hello": "Tere!", "family": "perekond", "dad": "isa", "friend": "sõber", "mum": "ema"},
                2: {"granny": "vanaema", "grandad": "vanaisa", "brother": "vend", "sister": "õde", "cat": "kass"},
                3: {"school": "kool", "pen": "pastapliiats", "ruler": "joonlaud", "rubber": "kustukumm", "book": "raamat"},
                4: {"apple": "õun", "red": "punane", "blue": "sinine", "green": "roheline", "yellow": "kollane"},
                5: {"dog": "koer", "horse": "hobune", "cow": "lehm", "pig": "siga", "sheep": "lammas"}
            }
        };

        let currentWords = [];
        let currentPair = {};
        let score = 0;
        let total = 0;

        function startTest(type) {
            currentWords = [];
            if (type === 'book1' || type === 'all') {
                for (let unit in CURRICULUM.book1) {
                    Object.assign(currentWords, CURRICULUM.book1[unit]);
                }
            }
            if (type === 'book2' || type === 'all') {
                for (let unit in CURRICULUM.book2) {
                    Object.assign(currentWords, CURRICULUM.book2[unit]);
                }
            }

            currentWords = Object.entries(currentWords);
            if (currentWords.length === 0) {
                alert("Sõnu ei leitud!");
                return;
            }

            document.getElementById('menu-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            nextQuestion();
        }

        function nextQuestion() {
            document.getElementById('feedback').innerText = "";
            document.getElementById('user-answer').value = "";
            
            let randomIndex = Math.floor(Math.random() * currentWords.length);
            currentPair = currentWords[randomIndex];
            
            document.getElementById('question-text').innerText = `Mis on eesti keeles sõna: "${currentPair[0]}"?`;
            document.getElementById('score').innerText = score;
            document.getElementById('total').innerText = total;
            document.getElementById('user-answer').focus();
        }

        function checkAnswer() {
            let userAns = document.getElementById('user-answer').value.trim().toLowerCase();
            let correctAns = currentPair[1].toLowerCase();

            total++;
            if (userAns === correctAns) {
                score++;
                document.getElementById('feedback').style.color = "green";
                document.getElementById('feedback').innerText = "Õige! 🎉";
            } else {
                document.getElementById('feedback').style.color = "red";
                document.getElementById('feedback').innerText = `Vale! Õige vastus oli: ${currentPair[1]}`;
            }

            setTimeout(nextQuestion, 1500);
        }

        // Enter klahvi vajutus vastuse saatmiseks
        document.getElementById('user-answer').addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                checkAnswer();
            }
        });

        function endTest() {
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
            let percentage = total > 0 ? Math.round((score / total) * 100) : 0;
            document.getElementById('final-stats').innerText = `Said ${score} õiget vastust ${total} küsimusest. Tulemus: ${percentage}%`;
        }
    </script>

</html>
