<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inglise-Eesti Sõnade Testija</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            max-width: 650px;
            margin: 30px auto;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            background: #fff;
        }
        h1 { text-align: center; color: #2c3e50; font-size: 24px; }
        .menu, .game, .print-view { margin-top: 20px; }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 15px;
            margin: 5px 0;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
        }
        button:hover { background-color: #2980b9; }
        .secondary-btn { background-color: #95a5a6; }
        .secondary-btn:hover { background-color: #7f8c8d; }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
        }
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 15px 0;
        }
        .option-btn {
            background-color: #2ecc71;
            font-size: 16px;
            padding: 15px;
        }
        .option-btn:hover { background-color: #27ae60; }
        .hidden { display: none; }
        #stats { font-weight: bold; margin-bottom: 15px; color: #555; }
        #feedback { font-weight: bold; margin-top: 10px; font-size: 18px; min-height: 24px; }
        .audio-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 20px;
            padding: 0 5px;
            width: auto;
            display: inline;
        }
        /* Printimise stiilid */
        @media print {
            body { background: #fff; box-shadow: none; margin: 0; max-width: 100%; }
            .no-print { display: none !important; }
            .print-only { display: block !important; }
        }
        .print-only { display: none; }
        table.print-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        table.print-table th, table.print-table td { border: 1px solid #333; padding: 8px; text-align: left; }
    </style>
</head>
<body>

    <div class="no-print">
        <h1>🇬🇧 Inglise-Eesti Sõnade Testija 🇪🇪</h1>

        <!-- Peamenüü -->
        <div id="menu-screen" class="menu">
            <p><strong>Vali raamat ja unit:</strong></p>
            <select id="book-select" onchange="updateUnitOptions()" style="width:100%; padding:10px; margin-bottom:10px; font-size:16px;">
                <option value="book1">Book 1 (Units 1–15)</option>
                <option value="book2" selected>Book 2 (Units 1–20)</option>
            </select>
            
            <select id="unit-select" style="width:100%; padding:10px; margin-bottom:15px; font-size:16px;">
                <!-- Täidetakse automaatselt skriptiga koos nimedega -->
            </select>

            <p><strong>Vali vastamise viis:</strong></p>
            <button onclick="startTest('write')">Kirjalik vastamine</button>
            <button onclick="startTest('choice')">4 variandiga valikutest</button>
            <button class="secondary-btn" onclick="openPrintView()">🖨️ Prindi tööleht (käsitsi täitmiseks)</button>
        </div>

        <!-- Mängu vaade -->
        <div id="game-screen" class="game hidden">
            <div id="stats">Punkte: <span id="score">0</span> | Küsimusi: <span id="total">0</span></div>
            
            <div style="display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 15px;">
                <p id="question-text" style="font-size: 20px; font-weight: bold; margin: 0;"></p>
                <button class="audio-btn" onclick="speakCurrentWord()" title="Kuula hääldust">🔊</button>
            </div>

            <!-- Kirjalik sisend -->
            <div id="write-mode">
                <input type="text" id="user-answer" placeholder="Kirjuta eesti keeles..." autocomplete="off">
                <button onclick="checkWrittenAnswer()">Vasta</button>
            </div>

            <!-- 4 variandi ruudustik -->
            <div id="choice-mode" class="options-grid hidden">
                <button class="option-btn" onclick="checkChoiceAnswer(0)" id="opt0"></button>
                <button class="option-btn" onclick="checkChoiceAnswer(1)" id="opt1"></button>
                <button class="option-btn" onclick="checkChoiceAnswer(2)" id="opt2"></button>
                <button class="option-btn" onclick="checkChoiceAnswer(3)" id="opt3"></button>
            </div>

            <p id="feedback"></p>
            <button class="secondary-btn" onclick="endTest()" style="margin-top: 20px;">Lõpeta / Tagasi menüüsse</button>
        </div>

        <!-- Tulemuste vaade -->
        <div id="result-screen" class="menu hidden">
            <h2>Test on lõppenud!</h2>
            <p id="final-stats" style="font-size: 18px;"></p>
            <button onclick="location.reload()">Tagasi menüüsse</button>
        </div>
    </div>

    <!-- Printimise vaade -->
    <div id="print-screen" class="print-only">
        <h2 style="text-align:center;">Inglise-Eesti Sõnade Tööleht</h2>
        <p>Nimi: ___________________________ Kuupäev: _______________</p>
        <div id="print-content"></div>
        <div class="no-print" style="margin-top: 20px;">
            <button onclick="window.print()">Prindi leht</button>
            <button class="secondary-btn" onclick="location.reload()">Tagasi</button>
        </div>
    </div>

    <script>

                11: { name: "Unit 11", words: {"grass": "rohi", "dive": "sukelduma", "fish": "kala; kalad", "rock": "kivi; kalju", "acorn": "tammetõru", "oak": "tamm", "heavy": "raske"} },
                12: { name: "Unit 12", words: {"people": "inimene", "stupid": "rumal", "rule": "reegel", "rush": "tormama", "shout": "karjuma", "raise": "tõstma", "polite": "viisakas", "noise": "lärm", "litter": "praht", "sweet": "maiustus; magus", "ladder": "redel", "wrapper": "pakend", "meal": "eine; söögikord", "button": "nööp", "rainbow": "vikerkaar", "wave": "lehvitama"} },
                13: { name: "Unit 13", words: {"angry": "kuri; vihane", "fluffy": "kohev", "knit": "kuduma", "sound": "heli", "thunder": "kõu, müristamine", "fireworks": "ilutulestik", "walk": "jalutuskäik; kõndima", "gymnastics": "võimlemine", "train": "treenima", "club": "klubi", "friendship": "sõprus", "band": "pael"} },
                14: { name: "Unit 14", words: {"sometimes": "mõnikord", "never": "mitte kunagi", "stay": "jääma, viibima", "quickly": "kiiresti", "enjoy": "nautima", "hate": "vihkama", "enough": "küllalt", "hop": "hüppama", "wing": "tiib", "loud": "vali", "icy": "jäine", "keep": "hoidma", "always": "alati", "boat": "paat", "get dressed": "riidesse panema", "get up": "üles tõusma", "brush": "hari; harjama", "before": "enne", "because": "sellepärast, et", "usually": "tavaliselt", "comb": "kamm; kammima", "honey": "mesi", "recorder": "plokkflööt", "win": "võitma", "bed": "voodi", "piano": "klaver", "badminton": "sulgpall", "supper": "õhtusöök", "evening": "õhtu", "every": "iga", "key": "võti", "practise": "harjutama"} },

                17: { name: "Unit 17", words: {"kick": "jalaga lööma", "head": "pea", "score": "punktiseis", "bounce": "põrgatama", "throw": "viskama", "dodgeball": "rahvastepall", "team": "meeskond", "tournament": "turniir", "skill": "oskus", "practice": "harjutamine, treenimine", "basketball": "korvpall", "join": "liituma, liikmeks astuma", "coach": "treener", "forward": "edasi, ettepoole", "roll": "veeretama", "member": "liige"} },
                18: { name: "Unit 18", words: {"borrow": "laenama, laenuks võtma", "expensive": "hinnaline, kallis", "scary": "hirmutav", "trip": "reis", "mummy": "emme", "race": "võidujooks, sõit", "daddy": "issi", "travel": "reisima", "space": "kosmos", "spaceship": "kosmoselaev", "giant": "hiiglane", "joke": "nali", "tale": "lugu, jutt", "sun": "päike", "large": "suur", "earth": "maa (planeet)", "dwarf": "kääbus", "warmth": "soojus", "plant": "taim", "grow": "kasvama", "cleaner": "puhastaja, koristaja", "centimetre": "sentimeeter", "ocean": "ookean", "poke": "torkima, tõukama", "piece": "tükk, tükike", "dentist": "hambaarst", "dragon": "draakon"} },
                19: { name: "Unit 19", words: {"caterpillar": "röövik, tõuk", "hole": "auk", "picnic": "piknik, eine vabas õhus", "pack": "pakkima", "woods": "mets", "snack": "suupiste; näksima", "juice": "mahl", "forget": "unustama", "bread": "leib", "egg": "muna", "cheese": "juust", "butter": "või", "cucumber": "kurk", "carrot": "porgand", "cake": "kook", "radish": "redis", "some": "veidi", "sausage": "vorst", "idea": "mõte", "strawberry": "maasikas", "yummy": "maitsev, nämma", "blanket": "tekk", "cup": "tass", "plate": "taldrik", "pull": "tirima, tõmbama"} },
                20: { name: "Unit 20", words: {"bee": "mesilane", "snail": "tigu", "pond": "tiik", "motorbike": "mootorratas", "person": "inimene, isik", "whole": "terve, kogu", "fire": "tulekahju", "smoke": "suits", "alarm": "häire", "helmet": "kiiver", "reflector": "helkur", "uniform": "vormiriietus", "emergency": "erakorraline olukord", "dangerous": "ohtlik", "accident": "õnnetus", "ice": "jää", "somebody": "keegi", "everybody": "igaüks", "calm": "rahulik", "panic": "paanika", "possible": "võimalik", "safe": "ohutu, turvaline", "injure": "vigastama", "driver": "autojuht", "crack": "pragunema", "fall": "kukkuma", "safety": "ohutus, turvalisus", "cross": "ületama", "way": "tee; suund", "pavement": "kõnnitee", "afraid": "hirmunud", "ask": "küsima", "pocket": "tasku"} }
            }
        };

        let currentWords = [];
        let currentPair = {};
        let score = 0;
        let total = 0;
        let mode = 'write';
        let currentChoices = [];

        function updateUnitOptions() {
            let bookKey = document.getElementById('book-select').value;
            let unitSelect = document.getElementById('unit-select');
            unitSelect.innerHTML = '<option value="all">Kõik unitid koos</option>';
            
            let units = CURRICULUM[bookKey];
            for (let uNum in units) {
                let opt = document.createElement('option');
                opt.value = uNum;
                opt.innerText = `Unit ${uNum}: ${units[uNum].name}`;
                unitSelect.appendChild(opt);
            }
        }
        updateUnitOptions();

        function startTest(selectedMode) {
            mode = selectedMode;
            let bookKey = document.getElementById('book-select').value;
            let unitVal = document.getElementById('unit-select').value;
            
            let sourceDict = {};
            if (unitVal === 'all') {
                for (let u in CURRICULUM[bookKey]) {
                    Object.assign(sourceDict, CURRICULUM[bookKey][u].words);
                }
            } else {
                sourceDict = CURRICULUM[bookKey][unitVal].words || {};
            }

            currentWords = Object.entries(sourceDict);
            if (currentWords.length === 0) {
                alert("Valitud unitis pole sõnu!");
                return;
            }

            score = 0;
            total = 0;
            document.getElementById('menu-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');

            if (mode === 'write') {
                document.getElementById('write-mode').classList.remove('hidden');
                document.getElementById('choice-mode').classList.add('hidden');
            } else {
                document.getElementById('write-mode').classList.add('hidden');
                document.getElementById('choice-mode').classList.remove('hidden');
            }

            nextQuestion();
        }

        function nextQuestion() {
            document.getElementById('feedback').innerText = "";
            document.getElementById('user-answer').value = "";
            
            let randomIndex = Math.floor(Math.random() * currentWords.length);
            currentPair = currentWords[randomIndex];
            
            document.getElementById('question-text').innerText = `Mis on eesti keeles sõna: "${currentPair[0]}"?`;
            document.getElementById('score').innerText = score;
            document.getElementById('total').innerText = total;

            if (mode === 'choice') {
                setupChoices();
            } else {
                document.getElementById('user-answer').focus();
            }
        }

        function setupChoices() {
            let correctAns = currentPair[1];
            currentChoices = [correctAns];

            while (currentChoices.length < 4 && currentChoices.length < currentWords.length) {
                let randomPair = currentWords[Math.floor(Math.random() * currentWords.length)];
                let wrongAns = randomPair[1];
                if (!currentChoices.includes(wrongAns)) {
                    currentChoices.push(wrongAns);
                }
            }
            currentChoices.sort(() => Math.random() - 0.5);

            for (let i = 0; i < 4; i++) {
                let btn = document.getElementById(`opt${i}`);
                if (currentChoices[i]) {
                    btn.innerText = currentChoices[i];
                    btn.style.display = "block";
                } else {
                    btn.style.display = "none";
                }
            }
        }

        function checkWrittenAnswer() {
            let userAns = document.getElementById('user-answer').value.trim().toLowerCase();
            let correctAns = currentPair[1].toLowerCase();

            total++;
            if (userAns === correctAns) {
                score++;
                document.getElementById('feedback').style.color = "green";
                document.getElementById('feedback').innerText = "Õige! 🎉";
                setTimeout(nextQuestion, 1200);
            } else {
                document.getElementById('feedback').style.color = "red";
                document.getElementById('feedback').innerText = `Vale! Õige vastus oli: ${currentPair[1]}`;
                setTimeout(nextQuestion, 2000);
            }
        }

        function checkChoiceAnswer(index) {
            let chosenAns = currentChoices[index];
            total++;

            if (chosenAns === currentPair[1]) {
                score++;
                document.getElementById('feedback').style.color = "green";
                document.getElementById('feedback').innerText = "Õige! 🎉";
                setTimeout(nextQuestion, 1200);
            } else {
                document.getElementById('feedback').style.color = "red";
                document.getElementById('feedback').innerText = `Vale! Õige vastus oli: ${currentPair[1]}`;
                setTimeout(nextQuestion, 2000);
            }
        }

        document.getElementById('user-answer').addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                checkWrittenAnswer();
            }
        });

        function speakCurrentWord() {
            if (!currentPair[0]) return;
            let utterance = new SpeechSynthesisUtterance(currentPair[0]);
            utterance.lang = 'en-GB';
            window.speechSynthesis.speak(utterance);
        }

        function endTest() {
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
            let percentage = total > 0 ? Math.round((score / total) * 100) : 0;
            document.getElementById('final-stats').innerText = `Said ${score} õiget vastust ${total} küsimusest. Tulemus: ${percentage}%`;
        }

        function openPrintView() {
            let bookKey = document.getElementById('book-select').value;
            let unitVal = document.getElementById('unit-select').value;
            
            let sourceDict = {};
            if (unitVal === 'all') {
                for (let u in CURRICULUM[bookKey]) {
                    Object.assign(sourceDict, CURRICULUM[bookKey][u].words);
                }
            } else {
                sourceDict = CURRICULUM[bookKey][unitVal].words || {};
            }

            let html = `<table class="print-table"><thead><tr><th>Inglise keel</th><th>Eesti keel (kirjuta siia)</th></tr></thead><tbody>`;
            for (let [eng, est] of Object.entries(sourceDict)) {
                html += `<tr><td><strong>${eng}</strong></td><td></td></tr>`;
            }
            html += `</tbody></table>`;

            document.getElementById('print-content').innerHTML = html;
            document.getElementById('menu-screen').classList.add('hidden');
            document.getElementById('print-screen').classList.remove('hidden');
        }
    </script>
</body>
</html>
