            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            width: 100%;
            text-align: center;
        }
        h1, h2 {
            color: #2c3e50;
            margin-bottom: 20px;
        }
        select, input[type="text"], button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 1rem;
            box-sizing: border-box;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #2980b9;
        }
        .btn-audio {
            background-color: #2ecc71;
            margin-bottom: 15px;
        }
        .btn-audio:hover {
            background-color: #27ae60;
        }
        .btn-secondary {
            background-color: #95a5a6;
        }
        .btn-secondary:hover {
            background-color: #7f8c8d;
        }
        .btn-warning {
            background-color: #e67e22;
        }
        .btn-warning:hover {
            background-color: #d35400;
        }
        .option-btn {
            background-color: #ecf0f1;
            color: #2c3e50;
            border: 1px solid #bdc3c7;
            margin: 8px 0;
            position: relative;
            text-align: left;
            padding-right: 50px;
        }
        .option-btn::after {
            content: attr(data-length);
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background-color: #bdc3c7;
            color: #2c3e50;
            font-size: 0.75rem;
            padding: 3px 7px;
            border-radius: 4px;
            font-weight: bold;
        }
        .option-btn:hover {
            background-color: #dcdde1;
        }
        .hidden {
            display: none;
        }
        .feedback {
            font-weight: bold;
            margin: 15px 0;
            padding: 10px;
            border-radius: 5px;
        }
        .correct {
            background-color: #d4edda;
            color: #155724;
        }
        .incorrect {
            background-color: #f8d7da;
            color: #721c24;
        }
        .stats {
            font-size: 0.9rem;
            color: #7f8c8d;
            margin-bottom: 15px;
        }

        /* PRINTIMISE STIILID */
        #print-screen {
            text-align: left;
        }
        .print-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            font-size: 0.95rem;
        }
        .print-table th, .print-table td {
            border: 1px solid #bdc3c7;
            padding: 10px 12px;
            vertical-align: middle;
        }
        .print-table th {
            background-color: #f8f9fa;

            background-color: #ecf0f1;

            padding: 2px 6px;
            border-radius: 4px;
            color: #7f8c8d;
            font-family: sans-serif;
            font-weight: bold;
        }

        @media print {
            body {
                background-color: white;
                padding: 0;
                display: block;
            }
            .container {
                box-shadow: none;
                max-width: 100%;

<div class="container">

    <div id="setup-screen">

        <select id="direction-select">

        <button onclick="startQuiz()">Alusta / Loo leht</button>

    <!-- KÜSIMUSTE VAADE -->
    <div id="quiz-screen" class="hidden">
        <div class="stats" id="progress-stats">Küsimus 1 / 10</div>
        
        <button id="audio-btn" class="btn-audio hidden" onclick="playAudio()">🔊 Kuula hääldust</button>
        
        <h3 id="question-prompt">Küsimus siia</h3>
        
        <!-- Režiim 1: Kirjutamine -->
        <div id="input-mode-container">

        <div id="feedback-box" class="hidden"></div>

        <button class="btn-secondary no-print" style="margin-top: 25px;" onclick="resetToSetup()">🏠 Katkesta ja tagasi algusesse</button>
    </div>

    <!-- PRINTIMISE VAADE -->
    <div id="print-screen" class="hidden">
        <h2 id="print-title">Sõnavara tööleht</h2>

        <table class="print-table">
            <thead>

                    <th>Inglise keel</th>
                    <th>Eesti keel</th>
                </tr>
            </thead>
            <tbody id="print-table-body">
                <!-- Sõnad genereeritakse siia -->
            </tbody>
        </table>
        <button class="no-print" style="margin-top: 20px;" onclick="window.print()">🖨️ Prindi tööleht</button>
        <button class="no-print btn-secondary" onclick="resetToSetup()">Tagasi algusesse</button>
    </div>

    <!-- TULEMUSTE VAADE -->
    <div id="result-screen" class="hidden">

        <p id="final-score">Sinu tulemus: 0/0</p>
        <div id="mistakes-container" style="text-align: left; margin: 15px 0;"></div>
        <button onclick="resetToSetup()">Tagasi algusesse</button>

</div>

    let currentQuestions = [];
    let currentIndex = 0;
    let score = 0;
    let mistakes = [];
    let skippedOnce = new Set();
    let direction = "en-et";
    let testMode = "input";
    let currentEnglishWord = "";
    let currentCorrectAnswer = "";
    let currentChoices = [];
    let allAvailableAnswers = [];

    window.onload = function() {
        initUnitSelectors();
        rebuildAllAnswersPool();

        document.getElementById("user-answer").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                checkInputAnswer();
            }
        });
    };

    function initUnitSelectors() {
        const select = document.getElementById("unit-select");
        select.innerHTML = '<option value="all">⭐ Kõik unitid korraga (1-20)</option>';

        for (let unitName in vocabulary) {
            let option = document.createElement("option");
            option.value = unitName;
            option.textContent = unitName;
            select.appendChild(option);
        }
    }

    function rebuildAllAnswersPool() {
        allAvailableAnswers = [];
        for (let unit in vocabulary) {
            for (let eng in vocabulary[unit]) {
                allAvailableAnswers.push({ eng, est: vocabulary[unit][eng] });
            }
        }
    }

    function startQuiz() {
        const selectedUnit = document.getElementById("unit-select").value;
        testMode = document.getElementById("mode-select").value;
        direction = document.getElementById("direction-select").value;
        
        let questionsObj = {};
        if (selectedUnit === "all") {
            for (let unit in vocabulary) {
                Object.assign(questionsObj, vocabulary[unit]);
            }
        } else {
            questionsObj = vocabulary[selectedUnit];
        }

        currentQuestions = Object.entries(questionsObj);
        if (currentQuestions.length === 0) {
            alert("Selles unittis pole ühtegi sõna!");
            return;
        }

        if (testMode === "print") {
            document.getElementById("setup-screen").classList.add("hidden");
            document.getElementById("quiz-screen").classList.add("hidden");
            document.getElementById("result-screen").classList.add("hidden");
            document.getElementById("print-screen").classList.remove("hidden");

            document.getElementById("print-title").textContent = `Sõnavara: ${selectedUnit === "all" ? "Kõik unitid (1-20)" : selectedUnit}`;
            
            const tbody = document.getElementById("print-table-body");
            tbody.innerHTML = "";

            currentQuestions.forEach(([eng, est]) => {
                let row = document.createElement("tr");
                
                // Mõlemale poolele lisame sõna ja tähtede arvu väikese märgi nurka/kõrvale ilma alakriipsudeta
                row.innerHTML = `
                    <td>
                        <div class="print-item-container">
                            <strong>${eng}</strong>
                            <span class="length-badge">[${eng.length}]</span>
                        </div>
                    </td>
                    <td>
                        <div class="print-item-container">
                            <span style="color: transparent; user-select: none;">${est}</span>
                            <span class="length-badge">[${est.length}]</span>
                        </div>
                    </td>
                `;
                tbody.appendChild(row);
            });
            return;
        }

        shuffle(currentQuestions);

        currentIndex = 0;
        score = 0;
        mistakes = [];
        skippedOnce = new Set();

        document.getElementById("setup-screen").classList.add("hidden");
        document.getElementById("print-screen").classList.add("hidden");
        document.getElementById("result-screen").classList.add("hidden");
        document.getElementById("quiz-screen").classList.remove("hidden");

        const inputContainer = document.getElementById("input-mode-container");
        const choicesContainer = document.getElementById("choices-mode-container");

        if (testMode === "input") {
            inputContainer.classList.remove("hidden");
            choicesContainer.classList.add("hidden");
        } else {
            inputContainer.classList.add("hidden");
            choicesContainer.classList.remove("hidden");
        }
        
        loadQuestion();
    }

    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            let j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
    }

    function loadQuestion() {
        if (currentIndex >= currentQuestions.length) {
            showResults();
            return;
        }

        document.getElementById("progress-stats").textContent = `Küsimus ${currentIndex + 1} / ${currentQuestions.length}`;
        document.getElementById("user-answer").value = "";
        
        const feedbackBox = document.getElementById("feedback-box");
        feedbackBox.classList.add("hidden");
        feedbackBox.className = "hidden";

        let [eng, est] = currentQuestions[currentIndex];
        currentEnglishWord = eng;
        currentCorrectAnswer = (direction === "en-et") ? est : eng;

        const audioBtn = document.getElementById("audio-btn");
        const promptEl = document.getElementById("question-prompt");

        if (direction === "en-et") {
            promptEl.textContent = `Kuidas on eesti keeles: "${eng}"?`;
            audioBtn.classList.remove("hidden");
            playAudio();
        } else {
            promptEl.textContent = `Kuidas on inglise keeles: "${est}"?`;
            audioBtn.classList.add("hidden");
        }

        if (testMode === "input") {
            document.getElementById("user-answer").focus();
        } else {
            setupChoices();
        }
    }

    function setupChoices() {
        let wrongPool = allAvailableAnswers.filter(item => {
            let val = (direction === "en-et") ? item.est : item.eng;
            return val.toLowerCase() !== currentCorrectAnswer.toLowerCase();
        });
        shuffle(wrongPool);

        let choices = [currentCorrectAnswer];
        for (let i = 0; i < 3 && i < wrongPool.length; i++) {
            let val = (direction === "en-et") ? wrongPool[i].est : wrongPool[i].eng;
            choices.push(val);
        }
        shuffle(choices);
        currentChoices = choices;

        for (let i = 0; i < 4; i++) {
            let btn = document.getElementById(`choice-${i}`);
            btn.textContent = choices[i] || "";
            btn.setAttribute('data-length', choices[i] ? `[${choices[i].length}]` : '');
            btn.disabled = false;
        }
    }

    function playAudio() {
        if ('speechSynthesis' in window && currentEnglishWord) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(currentEnglishWord);
            utterance.lang = 'en-US';
            window.speechSynthesis.speak(utterance);
        }
    }

    function checkInputAnswer() {
        let userAnswer = document.getElementById("user-answer").value.trim();
        let currentPair = currentQuestions[currentIndex];

        if (userAnswer.toLowerCase() === currentCorrectAnswer.toLowerCase()) {
            score++;
            showFeedback(true, "Õige!");
            currentIndex++;
        } else {
            if (skippedOnce.has(currentPair[0])) {
                if (!mistakes.some(m => m[0] === currentPair[0])) {
                    mistakes.push(currentPair);
                }
                showFeedback(false, `Vale! Õige vastus oli: ${currentCorrectAnswer}`);
            } else {
                skippedOnce.add(currentPair[0]);
                currentQuestions.push(currentPair);
                showFeedback(false, `Vale! Sõna läks kordamisele ja tuleb hiljem uuesti.`);
            }
            currentIndex++;
        }
    }

    function skipInputAnswer() {
        let currentPair = currentQuestions[currentIndex];

        if (skippedOnce.has(currentPair[0])) {
            if (!mistakes.some(m => m[0] === currentPair[0])) {
                mistakes.push(currentPair);
            }
            showFeedback(false, `Vahele jäetud! Õige vastus oli: ${currentCorrectAnswer}`);
        } else {
            skippedOnce.add(currentPair[0]);
            currentQuestions.push(currentPair);
            showFeedback(false, `Jäetud vahele, sõna tuleb hiljem uuesti.`);
        }
        currentIndex++;
    }

    function checkChoiceAnswer(index) {
        for (let i = 0; i < 4; i++) {
            document.getElementById(`choice-${i}`).disabled = true;
        }

        let chosenAnswer = currentChoices[index];
        let currentPair = currentQuestions[currentIndex];

        if (chosenAnswer.toLowerCase() === currentCorrectAnswer.toLowerCase()) {
            score++;
            showFeedback(true, "Õige!");
            currentIndex++;
        } else {
            if (skippedOnce.has(currentPair[0])) {
                if (!mistakes.some(m => m[0] === currentPair[0])) {
                    mistakes.push(currentPair);
                }
                showFeedback(false, `Vale! Õige vastus oli: ${currentCorrectAnswer}`);
            } else {
                skippedOnce.add(currentPair[0]);
                currentQuestions.push(currentPair);
                showFeedback(false, `Vale! Sõna läks kordamisele ja tuleb hiljem uuesti.`);
            }
            currentIndex++;
        }
    }

    function showFeedback(isCorrect, text) {
        const box = document.getElementById("feedback-box");
        box.textContent = text;
        box.className = "feedback " + (isCorrect ? "correct" : "incorrect");
        box.classList.remove("hidden");

        setTimeout(loadQuestion, 1800);
    }

    function showResults() {
        document.getElementById("quiz-screen").classList.add("hidden");
        document.getElementById("result-screen").classList.remove("hidden");

        document.getElementById("final-score").textContent = `Test läbi! Kokku esines raskusi ${mistakes.length} sõnaga.`;

        const container = document.getElementById("mistakes-container");
        container.innerHTML = "";

        if (mistakes.length > 0) {
            let html = "<h4>Sõnad, millega eksisid:</h4><ul>";
            mistakes.forEach(m => {
                html += `<li><strong>${m[0]}</strong> - ${m[1]}</li>`;
            });
            html += "</ul>";
            container.innerHTML = html;
        } else {
            container.innerHTML = "<p>Suurepärane! Vastasid kõigile õigesti!</p>";
        }
    }

    function resetToSetup() {
        window.speechSynthesis.cancel();
        document.getElementById("quiz-screen").classList.add("hidden");
        document.getElementById("result-screen").classList.add("hidden");
        document.getElementById("print-screen").classList.add("hidden");
        document.getElementById("setup-screen").classList.remove("hidden");
    }
</script>
