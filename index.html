<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inglise keele sõnavaratester</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
        }
        .container {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }
        select, button, input {
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
            flex: 1;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #2980b9;
        }
        .question-box {
            margin-top: 20px;
            padding: 20px;
            background: #ecf0f1;
            border-radius: 6px;
            text-align: center;
        }
        .options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
        }
        .option-btn {
            background-color: #fff;
            color: #333;
            border: 1px solid #bdc3c7;
        }
        .option-btn:hover {
            background-color: #dfe6e9;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Sõnavaratester</h1>

    <div class="controls">
        <select id="bookSelect">
            <option value="book1">Book 1</option>
            <option value="book2">Book 2</option>
        </select>

        <select id="unitSelect">
            <option value="all">⭐ Kõik unitid korraga</option>
        </select>

        <select id="modeSelect">
            <option value="input">Kirjuta vastus ise</option>
            <option value="choices">Vali 4 variandi seast</option>
        </select>

        <select id="directionSelect">
            <option value="en-et">Inglise -> Eesti</option>
            <option value="et-en">Eesti -> Inglise</option>
        </select>
    </div>

    <button id="startBtn">Alusta testi</button>

    <div id="testArea" class="hidden">
        <div id="progressText">Küsimus 1 / 10</div>
        <h3 id="questionText">Küsimus siia</h3>

        <div id="inputModeDiv">
            <input type="text" id="userAnswer" placeholder="Kirjuta vastus siia...">
            <button id="submitAnswerBtn" style="margin-top: 10px;">Vasta</button>
        </div>

        <div id="choicesModeDiv" class="options hidden">
            <!-- Valikud lisatakse skriptiga -->
        </div>

        <p id="feedbackText" style="font-weight: bold; margin-top: 15px;"></p>
    </div>

    <div id="resultArea" class="hidden" style="text-align: center;">
        <h2>Test läbi!</h2>
        <p id="finalScoreText">Sinu tulemus: 0/0</p>
        <button id="restartBtn">Proovi uuesti</button>
    </div>
</div>

    const bookSelect = document.getElementById('bookSelect');
    const unitSelect = document.getElementById('unitSelect');
    
    function updateUnits() {
        const selectedBook = bookSelect.value;
        const units = wordData[selectedBook];
        unitSelect.innerHTML = '<option value="all">⭐ Kõik unitid korraga</option>';
        for (let unitName in units) {
            let opt = document.createElement('option');
            opt.value = unitName;
            opt.textContent = unitName;
            unitSelect.appendChild(opt);
        }
    }

    bookSelect.addEventListener('change', updateUnits);
    updateUnits(); // Käivita lehe laadimisel
