<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inglise keele sõnavaratester</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
        }
        .container {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }
        select, button, input {
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
            flex: 1;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #2980b9;
        }
        .btn-secondary {
            background-color: #7f8c8d;
        }
        .btn-secondary:hover {
            background-color: #6c7a89;
        }
        .question-box {
            margin-top: 20px;
            padding: 20px;
            background: #ecf0f1;
            border-radius: 6px;
            text-align: center;
        }
        .options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
        }
        .option-btn {
            background-color: #fff;
            color: #333;
            border: 1px solid #bdc3c7;
            padding: 10px;
            cursor: pointer;
            border-radius: 4px;
        }
        .option-btn:hover {
            background-color: #dfe6e9;
        }
        .hidden {
            display: none;
        }
        .audio-btn {
            background: #2ecc71;
            margin-left: 10px;
            padding: 5px 10px;
            font-size: 14px;
            flex: unset;
        }
        .audio-btn:hover {
            background: #27ae60;
        }

        /* Printimisstiilid */
        @media print {
            body {
                background-color: #fff;
                color: #000;
                max-width: 100%;
                padding: 0;
            }
            .container {
                box-shadow: none;
                padding: 0;
            }
            .controls, button, #testArea, #resultArea, .print-hide {
                display: none !important;
            }
            #printArea {
                display: block !important;
            }
        }
        #printArea {
            display: none;
        }
        .print-unit-title {
            margin-top: 20px;
            font-size: 18px;
            border-bottom: 2px solid #333;
            padding-bottom: 5px;
        }
        .print-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            margin-bottom: 15px;
        }
        .print-table th, .print-table td {
            border: 1px solid #999;
            padding: 8px 10px;
            text-align: left;
        }
        .print-table th {
            background-color: #f2f2f2;
        }
        .print-answer-cell {
            width: 50%;
        }
    </style>
</head>

<div class="container">
    <h1 class="print-hide">Sõnavaratester</h1>

    <div class="controls print-hide">
        <select id="bookSelect">
            <option value="book1">Book 1 (15 unitit)</option>
            <option value="book2">Book 2 (20 unitit)</option>
        </select>

        <select id="unitSelect">
            <option value="all">⭐ Kõik unitid korraga</option>
        </select>

        <select id="modeSelect">
            <option value="input">Kirjuta vastus ise</option>
            <option value="choices">Vali 4 variandi seast</option>
        </select>

        <select id="directionSelect">
            <option value="en-et">Inglise -> Eesti</option>
            <option value="et-en">Eesti -> Inglise</option>
        </select>
    </div>

    <div class="controls print-hide">
        <button id="startBtn">Alusta testi</button>
    </div>

    <!-- Printimise seadistuse paneel -->
    <div class="controls print-hide" style="background: #eef2f3; padding: 15px; border-radius: 6px; margin-top: 10px;">
        <h3 style="margin-top: 0; width: 100%; color: #2c3e50;">Töölehe printimine</h3>
        <select id="printModeSelect" style="flex: 2;">

            <option value="et-en">Tööleht: Eesti -> Inglise (Tühi kast)</option>
        </select>
        <button id="printViewBtn" class="btn-secondary" style="flex: 1;">Prindi tööleht</button>
    </div>

    <!-- Testiala -->
    <div id="testArea" class="hidden">
        <div id="progressText" style="font-weight: bold; margin-bottom: 10px;">Küsimus 1 / 10</div>
        
        <div style="display: flex; align-items: center; justify-content: center; margin-bottom: 15px;">
            <h3 id="questionText" style="margin: 0;">Küsimus siia</h3>
            <button id="speakBtn" class="audio-btn" title="Kuula hääldust">🔊 Kuula</button>
        </div>

        <div id="inputModeDiv">
            <input type="text" id="userAnswer" placeholder="Kirjuta vastus siia...">
            <br>
            <button id="submitAnswerBtn" style="margin-top: 10px; width: 100%;">Vasta</button>
        </div>

        <div id="choicesModeDiv" class="options hidden"></div>

        <p id="feedbackText" style="font-weight: bold; margin-top: 15px;"></p>
    </div>

    <!-- Tulemuste ala -->
    <div id="resultArea" class="hidden" style="text-align: center;">
        <h2>Test läbi!</h2>
        <p id="finalScoreText" style="font-size: 18px; margin: 15px 0;">Sinu tulemus: 0/0</p>
        <button id="restartBtn">Proovi uuesti</button>
    </div>

    <!-- Prinditav ala -->
    <div id="printArea">
        <h2 id="printHeaderTitle">Inglise keele sõnavara nimekiri</h2>
        <div id="printContent"></div>
    </div>
</div>

    const bookSelect = document.getElementById('bookSelect');
    const unitSelect = document.getElementById('unitSelect');
    const modeSelect = document.getElementById('modeSelect');
    const directionSelect = document.getElementById('directionSelect');
    const startBtn = document.getElementById('startBtn');
    const printViewBtn = document.getElementById('printViewBtn');
    const printModeSelect = document.getElementById('printModeSelect');
    
    const testArea = document.getElementById('testArea');
    const resultArea = document.getElementById('resultArea');
    const progressText = document.getElementById('progressText');
    const questionText = document.getElementById('questionText');
    const speakBtn = document.getElementById('speakBtn');
    const inputModeDiv = document.getElementById('inputModeDiv');
    const choicesModeDiv = document.getElementById('choicesModeDiv');
    const userAnswer = document.getElementById('userAnswer');
    const submitAnswerBtn = document.getElementById('submitAnswerBtn');
    const feedbackText = document.getElementById('feedbackText');
    const finalScoreText = document.getElementById('finalScoreText');
    const restartBtn = document.getElementById('restartBtn');
    const printContent = document.getElementById('printContent');
    const printHeaderTitle = document.getElementById('printHeaderTitle');

    let currentQuestions = [];
    let currentIndex = 0;
    let score = 0;
    let currentEnglishWord = "";

    function updateUnits() {
        const selectedBook = bookSelect.value;
        const units = wordData[selectedBook];
        unitSelect.innerHTML = '<option value="all">⭐ Kõik unitid korraga</option>';
        for (let unitName in units) {
            let opt = document.createElement('option');
            opt.value = unitName;
            opt.textContent = unitName;
            unitSelect.appendChild(opt);
        }
    }

    bookSelect.addEventListener('change', updateUnits);
    updateUnits();

    function speakWord(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 0.9;
            window.speechSynthesis.speak(utterance);
        }
    }

    speakBtn.onclick = () => {
        if (currentEnglishWord) {
            speakWord(currentEnglishWord);
        }
    };

    function startTest() {
        const book = bookSelect.value;
        const unit = unitSelect.value;
        
        let pool = [];
        if (unit === 'all') {
            for (let u in wordData[book]) {
                pool = pool.concat(wordData[book][u]);
            }
        } else {
            pool = wordData[book][unit];
        }

        if (!pool || pool.length === 0) {
            alert('Selles unitis pole sõnu!');
            return;
        }

        currentQuestions = [...pool].sort(() => 0.5 - Math.random()).slice(0, 10);
        currentIndex = 0;
        score = 0;

        testArea.classList.remove('hidden');
        resultArea.classList.add('hidden');
        startBtn.classList.add('hidden');

        showQuestion();
    }

    function showQuestion() {
        feedbackText.textContent = '';
        userAnswer.value = '';
        
        if (currentIndex >= currentQuestions.length) {
            endTest();
            return;
        }

        progressText.textContent = `Küsimus ${currentIndex + 1} / ${currentQuestions.length}`;
        
        const q = currentQuestions[currentIndex];
        const direction = directionSelect.value;
        
        if (direction === 'en-et') {
            currentEnglishWord = q.en;
            questionText.textContent = `Mis on eesti keeles: "${q.en}"?`;
            speakWord(q.en);
            speakBtn.style.display = 'inline-block';
        } else {
            currentEnglishWord = q.en;
            questionText.textContent = `Mis on inglise keeles: "${q.et}"?`;
            speakBtn.style.display = 'none';
        }

        const mode = modeSelect.value;
        if (mode === 'input') {
            inputModeDiv.classList.remove('hidden');
            choicesModeDiv.classList.add('hidden');
            setTimeout(() => userAnswer.focus(), 50);
        } else {
            inputModeDiv.classList.add('hidden');
            choicesModeDiv.classList.remove('hidden');
            setupChoices(q, direction);
        }
    }

    function setupChoices(q, direction) {
        choicesModeDiv.innerHTML = '';
        const book = bookSelect.value;
        const unit = unitSelect.value;
        
        let pool = [];
        if (unit === 'all') {
            for (let u in wordData[book]) {
                pool = pool.concat(wordData[book][u]);
            }
        } else {
            pool = wordData[book][unit];
        }

        const correctAnswer = direction === 'en-et' ? q.et : q.en;
        
        let wrongPool = pool.filter(item => {
            let val = direction === 'en-et' ? item.et : item.en;
            return val !== correctAnswer;
        });
        
        wrongPool.sort(() => 0.5 - Math.random());
        let choices = [correctAnswer];
        for (let i = 0; i < Math.min(3, wrongPool.length); i++) {
            choices.push(direction === 'en-et' ? wrongPool[i].et : wrongPool[i].en);
        }
        
        choices.sort(() => 0.5 - Math.random());

        choices.forEach(choice => {
            const btn = document.createElement('button');
            btn.textContent = choice;
            btn.className = 'option-btn';
            btn.onclick = () => checkAnswer(choice, correctAnswer);
            choicesModeDiv.appendChild(btn);
        });
    }

    function checkAnswer(userGiven, correct) {
        const cleanUser = userGiven.trim().toLowerCase();
        const cleanCorrect = correct.trim().toLowerCase();
        const correctOptions = cleanCorrect.split(/[,/;]/).map(s => s.trim());

        let isCorrect = correctOptions.includes(cleanUser) || cleanUser === cleanCorrect;

        if (isCorrect) {
            score++;
            feedbackText.style.color = 'green';
            feedbackText.textContent = 'Õige!';
        } else {
            feedbackText.style.color = 'red';
            feedbackText.textContent = `Vale! Õige vastus oli: ${correct}`;
        }

        currentIndex++;
        setTimeout(showQuestion, 1200);
    }

    submitAnswerBtn.onclick = () => {
        const q = currentQuestions[currentIndex];
        const direction = directionSelect.value;
        const correct = direction === 'en-et' ? q.et : q.en;
        checkAnswer(userAnswer.value, correct);
    };

    userAnswer.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            submitAnswerBtn.click();
        }
    });

    function endTest() {
        testArea.classList.add('hidden');
        resultArea.classList.remove('hidden');
        startBtn.classList.remove('hidden');
        finalScoreText.textContent = `Sinu tulemus: ${score} / ${currentQuestions.length}`;
    }

    printViewBtn.onclick = () => {
        const book = bookSelect.value;
        const printMode = printModeSelect.value;
        const units = wordData[book];
        
        let bookTitle = book === 'book1' ? 'Book 1' : 'Book 1';
        if(book === 'book2') bookTitle = 'Book 2';

        if (printMode === 'dict') {
            printHeaderTitle.textContent = `${bookTitle} – Sõnade nimekiri`;
        } else if (printMode === 'en-et') {
            printHeaderTitle.textContent = `${bookTitle} – Tööleht (Inglise -> Eesti)`;
        } else {
            printHeaderTitle.textContent = `${bookTitle} – Tööleht (Eesti -> Inglise)`;
        }

        let html = '';
        for (let unitName in units) {
            html += `<div class="print-unit-title"><strong>${unitName}</strong></div>`;
            html += `<table class="print-table"><thead><tr>`;

            if (printMode === 'en-et') {
                html += `<th>Inglise keel</th><th class="print-answer-cell">Eesti keel (kirjuta vastus)</th>`;
            } else if (printMode === 'et-en') {
                html += `<th>Eesti keel</th><th class="print-answer-cell">Inglise keel (kirjuta vastus)</th>`;
            } else {
                html += `<th>Inglise keel</th><th>Eesti keel</th>`;
            }

            html += `</tr></thead><tbody>`;

            units[unitName].forEach(word => {
                if (printMode === 'en-et') {
                    html += `<tr><td>${word.en}</td><td class="print-answer-cell"></td></tr>`;
                } else if (printMode === 'et-en') {
                    html += `<tr><td>${word.et}</td><td class="print-answer-cell"></td></tr>`;
                } else {
                    html += `<tr><td>${word.en}</td><td>${word.et}</td></tr>`;
                }
            });

            html += `</tbody></table>`;
        }

        printContent.innerHTML = html;
        window.print();
    };

    startBtn.onclick = startTest;
    restartBtn.onclick = startTest;
