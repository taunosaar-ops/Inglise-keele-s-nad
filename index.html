<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sõnade treenija (Teemade kaupa)</title>
    
    <!-- PWA Manifest ja Service Worker seadistus -->
    <link rel="manifest" id="dynamic-manifest">
    <meta name="theme-color" content="#2980b9">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Sõnade treenija">

    <!-- Laeme Tesseract.js raamatukogu pildilt teksti lugemiseks -->
    <script src="https://unpkg.com/tesseract.js@v4.1.1/dist/tesseract.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            color: #333;
            max-width: 600px;
            margin: 30px auto;
            padding: 20px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h1, h2 { color: #1b4f72; text-align: center; }
        .menu, .section { margin-bottom: 20px; }
        button {
            background-color: #2980b9;
            color: white;
            border: none;
            padding: 12px 15px;
            margin: 6px 0;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            box-sizing: border-box;
        }
        button:hover { background-color: #2471a3; }
        button.secondary { background-color: #7f8c8d; }
        button.secondary:hover { background-color: #626d70; }
        button.success { background-color: #27ae60; }
        button.success:hover { background-color: #219653; }
        button.admin-btn { background-color: #d35400; }
        button.admin-btn:hover { background-color: #b94400; }

        input[type="text"], input[type="file"], input[type="password"], select {
            padding: 10px;
            width: calc(100% - 22px);
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
            box-sizing: border-box;
        }
        .hidden { display: none !important; }
        .word-list {
            list-style: none;
            padding: 0;
            max-height: 150px;
            overflow-y: auto;
            border: 1px solid #eee;
            border-radius: 4px;
            margin-bottom: 10px;
        }
        .word-list li {
            padding: 8px 12px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .word-list li:last-child { border-bottom: none; }
        .feedback {
            font-weight: bold;
            margin-top: 10px;
            text-align: center;
            font-size: 18px;
        }
        .correct { color: #27ae60; }
        .incorrect { color: #c0392b; }
        .stats { text-align: center; font-size: 14px; color: #666; margin-bottom: 15px; }
        .loading-box { text-align: center; font-style: italic; color: #d35400; margin: 10px 0; }
        textarea {
            width: 100%;
            height: 80px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
            margin-bottom: 10px;
        }
        .mode-select-box {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 6px;
            border: 1px solid #e2e8f0;
            text-align: center;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <h1>Sõnade treenija</h1>

    <!-- PEAMENÜÜ -->
    <div id="main-menu" class="menu">
        <p style="text-align: center;">Vali tegevus:</p>
        <button onclick="showUnitSelection('choice')">Ristküsitlus (Valikud)</button>
        <button onclick="showUnitSelection('write')">Kirjutamisharjutus</button>
        <hr style="border: 0; border-top: 1px solid #eee; margin: 15px 0;">
        <button onclick="requestAdminAccess()" class="admin-btn">🔒 Sõnade haldamine (Ainult loojale)</button>
    </div>

    <!-- TEEMA / UNIT VALIKU MENÜÜ -->
    <div id="unit-selection-section" class="section hidden">
        <h2 id="unit-selection-title">Vali teema</h2>
        <div class="mode-select-box" id="unit-buttons-container">
            <!-- Siia genereeritakse nupud -->
        </div>
        <button class="secondary" onclick="showSection('main-menu')" style="margin-top: 15px;">Tagasi menüüsse</button>
    </div>

    <!-- REŽIIMI JA SUUNA VALIKU VAADE -->
    <div id="direction-section" class="section hidden">
        <h2 id="direction-title">Harjutamise suund</h2>
        <div class="mode-select-box">
            <p style="margin-top: 0; font-weight: bold;" id="selected-unit-label"></p>
            <button onclick="startQuiz('est')">Inglise ➔ Eesti</button>
            <button onclick="startQuiz('eng')" class="success">Eesti ➔ Inglise</button>
        </div>
        <button class="secondary" onclick="showUnitSelection(activeModeType)" style="margin-top: 15px;">Tagasi teemade valikusse</button>
    </div>

    <!-- SÕNADE LISAMISE VAADE (KAITSTUD) -->
    <div id="add-section" class="section hidden">
        <h2>Sõnade haldamine (Looja vaade)</h2>
        
        <div style="margin-bottom: 10px;">
            <label style="font-weight: bold; display: block; margin-bottom: 5px;">Vali teema (Unit), kuhu sõnad lisatakse:</label>
            <select id="admin-unit-select" onchange="updateWordListUI()">
                <!-- Valikud täidetakse koodist -->
            </select>
        </div>

        <!-- Pildi üleslaadimine -->
        <div style="background: #f8f9fa; padding: 12px; border-radius: 6px; margin-bottom: 15px; border: 1px dashed #cbd5e1;">
            <label style="font-weight: bold; display: block; margin-bottom: 5px;">📸 Lisa õpiku pilt:</label>
            <input type="file" id="image-input" accept="image/*" onchange="processImage(event)">
            <div id="ocr-status" class="loading-box"></div>
        </div>

        <input type="text" id="eng-word" placeholder="Inglise keelne sõna (nt apple)">
        <input type="text" id="est-word" placeholder="Eesti keelne tõlge (nt õun)">
        <button onclick="addWord()" class="success">Lisa sõna valitud teemasse</button>

        <div style="margin-top: 15px;">
            <label style="font-size: 14px; font-weight: bold;">Tuvastatud või muudetav tekst (Rida-realt: inglise - eesti):</label>
            <textarea id="bulk-text" placeholder="Näiteks:&#10;apple - õun&#10;school - kool"></textarea>
            <button onclick="addBulkWords()">Lisa tekstikastist sõnad</button>
        </div>

        <h3 style="margin-top: 20px;">Valitud teema sõnad (<span id="word-count">0</span>):</h3>
        <ul id="word-list" class="word-list"></ul>
        
        <button class="secondary" onclick="showSection('main-menu')" style="margin-top: 15px;">Tagasi menüüsse</button>
    </div>

    <!-- KÜSITLUSE VAADE -->
    <div id="quiz-section" class="section hidden">
        <h2 id="quiz-title">Harjutamine</h2>
        <div class="stats" id="quiz-stats">Küsimus 1 / 5</div>
        
        <p id="question-text" style="font-size: 20px; text-align: center; font-weight: bold;"></p>
        
        <!-- Valikvastuste konteiner -->
        <div id="choices-container" style="display: flex; flex-direction: column; gap: 8px;" class="hidden"></div>
        
        <!-- Kirjutamisvastuse konteiner -->
        <div id="write-container" class="hidden">
            <input type="text" id="user-answer" placeholder="Kirjuta vaste..." autocomplete="off" autocapitalize="none" onkeypress="checkEnter(event)">
            <button onclick="checkWrittenAnswer()">Kontrolli</button>
        </div>

        <div id="feedback" class="feedback"></div>
        <div style="text-align: center; margin-top: 20px;">
            <button class="secondary" onclick="showUnitSelection(activeModeType)">Lõpeta / Tagasi</button>
        </div>
    </div>

<script>
    // Dünaamiline PWA manifest
    const manifestData = {
        "name": "Sõnade treenija",
        "short_name": "Sõnad",
        "start_url": "./",
        "display": "standalone",
        "background_color": "#ffffff",
        "theme_color": "#2980b9",
        "icons": [
            {
                "src": "data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🇬🇧</text></svg>",
                "sizes": "192x192",
                "type": "image/svg+xml"
            }
        ]
    };
    const manifestBlob = new Blob([JSON.stringify(manifestData)], { type: 'application/json' });
    document.getElementById('dynamic-manifest').href = URL.createObjectURL(manifestBlob);

    if ('serviceWorker' in navigator) {
        const swCode = `
            self.addEventListener('install', e => self.skipWaiting());
            self.addEventListener('activate', e => self.clients.claim());
            self.addEventListener('fetch', e => e.respondWith(fetch(e.request).catch(() => caches.match(e.request))));
        `;
        const swBlob = new Blob([swCode], { type: 'text/javascript' });
        navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(err => console.log('SW error:', err));
    }

    const ADMIN_PASSWORD = "1234";

    // Vaikimisi üksused
    const DEFAULT_UNITS = {
        "Unit 1": [
            { eng: "hello", est: "tere" },
            { eng: "goodbye", est: "nägemist" }
        ],
        "Unit 2": [
            { eng: "apple", est: "õun" },
            { eng: "school", est: "kool" },
            { eng: "book", est: "raamat" },
            { eng: "computer", est: "arvuti" },
            { eng: "them", est: "neid" },
            { eng: "all", est: "kõik" },
            { eng: "bad", est: "halb" },
            { eng: "especially", est: "eriti" },
            { eng: "test", est: "kontrolltöö" },
            { eng: "lucky", est: "õnnelik,õnnetoov" },
            { eng: "tell", est: "ütlema,siin" },
            { eng: "secret", est: "saladus,salajane" },
            { eng: "why", est: "miks" },
            { eng: "may", est: "võima,tohtima" },
            { eng: "lose", est: "kaotama" },
            { eng: "its", est: "selle oma(eluta olendi puhul)" },
            { eng: "magic", est: "nõidus,maagia" },
            { eng: "guess", est: "ära arvama" },
            { eng: "thirty", est: "kolmkümmend" },
            { eng: "forty", est: "nelikümmend" },
            { eng: "fifty", est: "viiskümmend" },
            { eng: "sixty", est: "kuuskümmend" },
            { eng: "seventy", est: "seitsekümmend" },
            { eng: "eighty", est: "kaheksakümmend" },
            { eng: "ninety", est: "üheksakümmend" },
            { eng: "hundred", est: "sada" },
            { eng: "afternoon", est: "pärastlõuna" },
            { eng: "in the afternoon", est: "pärastlõunal" },
            { eng: "hold", est: "hoidma,pidama" },
            { eng: "Hold on!", est: "Oota!" },
            { eng: "post", est: "postitama" },
            { eng: "address", est: "aadress" },
            { eng: "laptop", est: "sülearvuti" },
            { eng: "love", est: "armastama" },
            { eng: "paper", est: "paber" },
            { eng: "remember", est: "mäletama" },
            { eng: "swan", est: "luik" },
            { eng: "station", est: "jaam" },
            { eng: "road", est: "tee,maantee" },
            { eng: "helpful", est: "abivalmis" },
            { eng: "same", est: "sama" },
            { eng: "bigger", est: "suurem" },
            { eng: "smaller", est: "väiksem" },
            { eng: "than", est: "kui(võrdluses)" },
            { eng: "circle", est: "ring" },
            { eng: "make up", est: "moodustama" }
        ]
    };

    // Sunnime uuenduse sisse, kui mälus on vana struktuur
    let savedUnits = JSON.parse(localStorage.getItem('sonaraamat_units'));
    let units = savedUnits && typeof savedUnits === 'object' && !Array.isArray(savedUnits) ? savedUnits : DEFAULT_UNITS;

    let activeModeType = ''; 
    let selectedUnitKey = ''; 
    let quizDirection = 'est'; 
    let currentIndex = 0;
    let currentQuizList = [];
    let score = 0;
    let activeQuestion = null;

    function saveUnitsToStorage() {
        localStorage.setItem('sonaraamat_units', JSON.stringify(units));
    }

    function showSection(sectionId) {
        ['main-menu', 'unit-selection-section', 'direction-section', 'add-section', 'quiz-section'].forEach(id => {
            document.getElementById(id).classList.add('hidden');
        });
        document.getElementById(sectionId).classList.remove('hidden');
        
        if (sectionId === 'add-section') {
            populateAdminUnitSelect();
            updateWordListUI();
        }
    }

    function showUnitSelection(modeType) {
        activeModeType = modeType;
        const container = document.getElementById('unit-buttons-container');
        container.innerHTML = '';
        
        document.getElementById('unit-selection-title').innerText = modeType === 'choice' ? 'Vali teema (Ristküsitlus)' : 'Vali teema (Kirjutamine)';

        // Nupp "Kõik teemad kokku"
        const allBtn = document.createElement('button');
        allBtn.innerText = "⭐ Kõik teemad kokku";
        allBtn.className = "success";
        allBtn.onclick = () => selectUnit('ALL');
        container.appendChild(allBtn);

        // Nupud iga Unit-i jaoks
        Object.keys(units).forEach(unitName => {
            const btn = document.createElement('button');
            btn.innerText = `📁 ${unitName} (${units[unitName].length} sõna)`;
            btn.onclick = () => selectUnit(unitName);
            container.appendChild(btn);
        });

        showSection('unit-selection-section');
    }

    function selectUnit(unitKey) {
        selectedUnitKey = unitKey;
        let label = unitKey === 'ALL' ? 'Kõik teemad kokku' : `Valitud teema: ${unitKey}`;
        document.getElementById('selected-unit-label').innerText = label;
        showSection('direction-section');
    }

    function requestAdminAccess() {
        const password = prompt("Sisesta looja parool:");
        if (password === ADMIN_PASSWORD) {
            showSection('add-section');
        } else if (password !== null) {
            alert("Vale parool!");
        }
    }

    function populateAdminUnitSelect() {
        const select = document.getElementById('admin-unit-select');
        select.innerHTML = '';
        Object.keys(units).forEach(unitName => {
            const opt = document.createElement('option');
            opt.value = unitName;
            opt.innerText = unitName;
            select.appendChild(opt);
        });
    }

    function addWord() {
        const currentUnit = document.getElementById('admin-unit-select').value;
        const eng = document.getElementById('eng-word').value.trim();
        const est = document.getElementById('est-word').value.trim();
        
        if (eng && est) {
            if (!units[currentUnit]) units[currentUnit] = [];
            units[currentUnit].push({ eng, est });
            document.getElementById('eng-word').value = '';
            document.getElementById('est-word').value = '';
            saveUnitsToStorage();
            updateWordListUI();
        } else {
            alert("Palun täida mõlemad väljad!");
        }
    }

    function addBulkWords() {
        const currentUnit = document.getElementById('admin-unit-select').value;
        const text = document.getElementById('bulk-text').value.trim();
        if (!text) return;

        const lines = text.split('\n');
        let addedCount = 0;

        if (!units[currentUnit]) units[currentUnit] = [];

        lines.forEach(line => {
            let parts = line.split(/[-–:]/);
            if (parts.length >= 2) {
                let eng = parts[0].trim();
                let est = parts[1].trim();
                eng = eng.replace(/^\d+[\.\)]\s*/, '');
                if (eng && est) {
                    units[currentUnit].push({ eng, est });
                    addedCount++;
                }
            }
        });

        if (addedCount > 0) {
            saveUnitsToStorage();
            updateWordListUI();
            document.getElementById('bulk-text').value = '';
            alert(`Lisati edukalt ${addedCount} sõnapaari teemasse ${currentUnit}!`);
        } else {
            alert("Ei suutnud tekstist sõnapaare tuvastada.");
        }
    }

    function updateWordListUI() {
        const currentUnit = document.getElementById('admin-unit-select').value;
        const listEl = document.getElementById('word-list');
        const wordArr = units[currentUnit] || [];
        
        document.getElementById('word-count').innerText = wordArr.length;
        listEl.innerHTML = '';
        
        wordArr.forEach((item, index) => {
            const li = document.createElement('li');
            li.innerHTML = `<span><strong>${item.eng}</strong> – ${item.est}</span> <button style="width: auto; padding: 4px 8px; font-size: 12px; background-color: #e74c3c; margin:0;" onclick="removeWord('${currentUnit}', ${index})">Kustuta</button>`;
            listEl.appendChild(li);
        });
    }

    function removeWord(unitName, index) {
        units[unitName].splice(index, 1);
        saveUnitsToStorage();
        updateWordListUI();
    }

    function processImage(event) {
        const file = event.target.files[0];
        if (!file) return;

        const statusEl = document.getElementById('ocr-status');
        statusEl.innerText = "⏳ Loen pildilt teksti... Palun oota.";

        Tesseract.recognize(
            file,
            'eng+est',
            { 
                logger: m => {
                    if (m.status === 'recognizing text') {
                        statusEl.innerText = `⏳ Tuvastamine: ${Math.round(m.progress * 100)}%`;
                    }
                }
            }
        ).then(({ data: { text } }) => {
            statusEl.innerText = "✅ Tekst loetud! Kontrolli allolevat kasti ja vajuta 'Lisa tekstikastist sõnad'.";
            document.getElementById('bulk-text').value = text;
        }).catch(err => {
            console.error(err);
            statusEl.innerText = "❌ Viga pildist teksti lugemisel.";
        });
    }

    function startQuiz(direction) {
        quizDirection = direction; 
        
        let pool = [];
        if (selectedUnitKey === 'ALL') {
            Object.keys(units).forEach(u => {
                pool = pool.concat(units[u]);
            });
        } else {
            pool = units[selectedUnitKey] || [];
        }

        if (pool.length === 0) {
            alert("Valitud teemas ei ole ühtegi sõna!");
            return;
        }

        currentQuizList = [...pool].sort(() => Math.random() - 0.5);
        currentIndex = 0;
        score = 0;
        
        showSection('quiz-section');
        
        let titleMode = activeModeType === 'choice' ? 'Ristküsitlus' : 'Kirjutamine';
        let titleDir = direction === 'est' ? 'Inglise ➔ Eesti' : 'Eesti ➔ Inglise';
        document.getElementById('quiz-title').innerText = `${titleMode} (${selectedUnitKey}): ${titleDir}`;
        
        loadNextQuestion();
    }

    function loadNextQuestion() {
        document.getElementById('feedback').innerText = '';
        document.getElementById('user-answer').value = '';
        
        if (currentIndex >= currentQuizList.length) {
            document.getElementById('question-text').innerText = `Harjutus läbi! Sinu tulemus: ${score} / ${currentQuizList.length} õiget.`;
            document.getElementById('choices-container').classList.add('hidden');
            document.getElementById('write-container').classList.add('hidden');
            document.getElementById('quiz-stats').innerText = '';
            return;
        }

        document.getElementById('quiz-stats').innerText = `Küsimus ${currentIndex + 1} / ${currentQuizList.length}`;
        activeQuestion = currentQuizList[currentIndex];
        
        if (quizDirection === 'est') {
            document.getElementById('question-text').innerText = `Mis on sõna "${activeQuestion.eng}" tähendus eesti keeles?`;
        } else {
            document.getElementById('question-text').innerText = `Kuidas on inglise keeles "${activeQuestion.est}"?`;
        }

        if (activeModeType === 'choice') {
            document.getElementById('choices-container').classList.remove('hidden');
            document.getElementById('write-container').classList.add('hidden');
            setupChoices();
        } else {
            document.getElementById('choices-container').classList.add('hidden');
            document.getElementById('write-container').classList.remove('hidden');
            document.getElementById('user-answer').focus();
        }
    }

    function setupChoices() {
        const container = document.getElementById('choices-container');
        container.innerHTML = '';

        let targetProp = quizDirection === 'est' ? 'est' : 'eng';
        let options = [activeQuestion[targetProp]];
        
        let wrongPool = currentQuizList.filter(w => w[targetProp] !== activeQuestion[targetProp]).map(w => w[targetProp]);
        wrongPool.sort(() => Math.random() - 0.5);
        
        for (let i = 0; i < Math.min(3, wrongPool.length); i++) {
            options.push(wrongPool[i]);
        }
        options.sort(() => Math.random() - 0.5);

        options.forEach(opt => {
            const btn = document.createElement('button');
            btn.innerText = opt;
            btn.style.width = '100%';
            btn.onclick = () => checkChoiceAnswer(opt);
            container.appendChild(btn);
        });
    }

    function checkChoiceAnswer(selectedOpt) {
        const feedbackEl = document.getElementById('feedback');
        let targetVal = quizDirection === 'est' ? activeQuestion.est : activeQuestion.eng;

        if (selectedOpt === targetVal) {
            feedbackEl.innerText = "Õige!";
            feedbackEl.className = "feedback correct";
            score++;
        } else {
            feedbackEl.innerText = `Vale! Õige vastus oli: ${targetVal}`;
            feedbackEl.className = "feedback incorrect";
        }
        currentIndex++;
        setTimeout(loadNextQuestion, 1500);
    }

    function checkWrittenAnswer() {
        const userAns = document.getElementById('user-answer').value.trim().toLowerCase();
        let targetVal = quizDirection === 'est' ? activeQuestion.est : activeQuestion.eng;
        const correctAns = targetVal.toLowerCase();
        const feedbackEl = document.getElementById('feedback');

        if (userAns === correctAns) {
            feedbackEl.innerText = "Väga hea, õige!";
            feedbackEl.className = "feedback correct";
            score++;
        } else {
            feedbackEl.innerText = `Vale! Õige vaste oli: ${targetVal}`;
            feedbackEl.className = "feedback incorrect";
        }
        currentIndex++;
        setTimeout(loadNextQuestion, 1500);
    }

    function checkEnter(e) {
        if (e.key === 'Enter') {
            checkWrittenAnswer();
        }
    }
</script>

</body>
</html>
