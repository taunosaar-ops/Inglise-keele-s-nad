<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sõnade Testija</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            max-width: 650px;
            margin: 30px auto;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            background: #fff;
        }
        h1 { text-align: center; color: #2c3e50; font-size: 24px; }
        .menu, .game { margin-top: 20px; }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 15px;
            margin: 5px 0;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
        }
        button:hover { background-color: #2980b9; }
        .secondary-btn { background-color: #95a5a6; }
        .secondary-btn:hover { background-color: #7f8c8d; }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
        }
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 15px 0;
        }
        .option-btn {
            background-color: #2ecc71;
            font-size: 16px;
            padding: 15px;
        }
        .option-btn:hover { background-color: #27ae60; }
        .hidden { display: none; }
        #stats { font-weight: bold; margin-bottom: 15px; color: #555; }
        #feedback { font-weight: bold; margin-top: 10px; font-size: 18px; min-height: 24px; }
        .audio-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 20px;
            padding: 0 5px;
            width: auto;
            display: inline;
        }
        /* Printimise stiilid */
        @media print {
            body { background: #fff; box-shadow: none; margin: 0; max-width: 100%; }
            .no-print { display: none !important; }
            .print-only { display: block !important; }
        }
        .print-only { display: none; }
        table.print-table { 
            width: 100%; 
            border-collapse: collapse; 
            margin-top: 20px; 
            font-size: 16px;
        }
        table.print-table th, table.print-table td { 
            border: 1px solid #333; 
            padding: 0.5em 8px; 
            line-height: 1; 
            text-align: left; 
            vertical-align: middle; 
        }
    </style>
</head>
<body>

    <div class="no-print">
        <h1>🇬🇧 Sõnade Testija 🇪🇪</h1>

        <!-- Peamenüü -->
        <div id="menu-screen" class="menu">
            <p><strong>Vali raamat ja unit:</strong></p>
            <select id="book-select" onchange="updateUnitOptions()" style="width:100%; padding:10px; margin-bottom:10px; font-size:16px;">
                <option value="book1">Book 1 (Units 1–15)</option>
                <option value="book2" selected>Book 2 (Units 1–20)</option>
            </select>
            
            <select id="unit-select" style="width:100%; padding:10px; margin-bottom:15px; font-size:16px;">
                <!-- Täidetakse automaatselt skriptiga -->
            </select>

            <p><strong>Vali testi suund:</strong></p>
            <select id="direction-select" style="width:100%; padding:10px; margin-bottom:15px; font-size:16px;">
                <option value="en-et">Inglise ➔ Eesti</option>
                <option value="et-en">Eesti ➔ Inglise</option>
            </select>

            <p><strong>Vali vastamise viis:</strong></p>
            <button onclick="startTest('write')">Kirjalik vastamine</button>
            <button onclick="startTest('choice')">4 variandiga valikutest</button>
            <button class="secondary-btn" onclick="openPrintView()">🖨️ Prindi tööleht (käsitsi täitmiseks)</button>
        </div>

        <!-- Mängu vaade -->
        <div id="game-screen" class="game hidden">
            <div id="stats">Punkte: <span id="score">0</span> | Küsimusi: <span id="total">0</span></div>
            
            <div style="display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 15px;">
                <p id="question-text" style="font-size: 20px; font-weight: bold; margin: 0;"></p>
                <button id="audio-button" class="audio-btn" onclick="speakCurrentWord()" title="Kuula hääldust">🔊</button>
            </div>

            <!-- Kirjalik sisend -->
            <div id="write-mode">
                <input type="text" id="user-answer" placeholder="Kirjuta vastus..." autocomplete="off">
                <button onclick="checkWrittenAnswer()">Vasta</button>
            </div>

            <!-- 4 variandi ruudustik -->
            <div id="choice-mode" class="options-grid hidden">
                <button class="option-btn" onclick="checkChoiceAnswer(0)" id="opt0"></button>
                <button class="option-btn" onclick="checkChoiceAnswer(1)" id="opt1"></button>
                <button class="option-btn" onclick="checkChoiceAnswer(2)" id="opt2"></button>
                <button class="option-btn" onclick="checkChoiceAnswer(3)" id="opt3"></button>
            </div>

            <p id="feedback"></p>
            <button class="secondary-btn" onclick="endTest()" style="margin-top: 20px;">Lõpeta / Tagasi menüüsse</button>
        </div>

        <!-- Tulemuste vaade -->
        <div id="result-screen" class="menu hidden">
            <h2>Test on lõppenud!</h2>
            <p id="final-stats" style="font-size: 18px;"></p>
            <button onclick="location.reload()">Tagasi menüüsse</button>
        </div>
    </div>

    <!-- Printimise vaade -->
    <div id="print-screen" class="print-only">
        <h2 style="text-align:center;" id="print-title">Sõnade Tööleht</h2>
        <p>Nimi: ___________________________ Kuupäev: _______________</p>
        <div id="print-content"></div>
    </div>

    <script>
        const CURRICULUM = {
            book1: {
                1: { name: "Hello", words: {
                    "unit": "õppetükk", "Hello": "Tere!", "Hi": "Tere!", "I": "mina, ma", "am": "olen", "I am": "ma olen", "I's from": "Ma olen pärit",
                    "Britain": "Britannia", "America": "Ameerika", "Finland": "Soome", "Estonia": "Eesti", "and": "ja, ning", "you": "sina, teie",
                    "he": "tema (meessoost)", "she": "tema (naissoost)", "this": "see", "is": "on (olema 3. pööre ainsuses)", "He's / She's from": "Ta on pärit",
                    "good": "hea", "morning": "hommik", "Good morning!": "Tere hommikust!", "Miss": "preili", "what": "mis (küsisõna)", "what's": "mis on",
                    "your": "sinu; teie", "name": "nimi", "Sorry.": "Vabandust.", "late": "hilja", "Sorry, I'm late.": "Vabandust, et ma hilinesin.",
                    "that": "see (seal)", "that's": "see on", "OK": "okei, korras, hästi", "That's OK.": "Siin: Sellest pole madagi.", "Goodbye!": "Head päeva! Head aega!", "Bye-bye!": "Head päeva! Head aega!"
                }},
                2: { name: "Family", words: {
                    "family": "perekond", "dad": "isa", "my": "minu (oma)", "friend": "sõber", "Mr": "härra", "dog": "koer", "mum": "ema",
                    "granny": "vanaema", "grandad": "vanaisa", "brother": "vend", "sister": "õde", "cat": "kass", "his": "tema (oma) (meessoost)",
                    "her": "tema (oma) (naissoost)", "these": "need (siin)", "are": "oled, oleme, olete, on (mitmuses)", "big": "suur", "small": "väike",
                    "girl": "tüdruk", "girls": "tüdrukud", "boy": "poiss", "boys": "poisid", "book": "raamat", "ball": "pall", "pencil": "pliiats",
                    "horse": "hobune", "horses": "hobused", "new": "uus", "bike": "jalgratas", "cool": "äge, vinge", "police": "politsei",
                    "in": "sees; sisse (eessõna)", "come": "tulema", "say": "ütlema", "the": "artikkel", "the ABC": "tähestik", "shoe": "king",
                    "shoes": "kingad", "so": "nii", "beautiful": "ilus", "Thanks.": "Tänan.", "ladybird": "lepatriinu", "tooth": "hammas", "teeth": "hambad",
                    "fairy": "haldjas", "tooth fairy": "hambahaldjas", "lamb": "(lamba)tall"
                }},
                3: { name: "School things", words: {} },
                4: { name: "Colors & Toys", words: {} },
                5: { name: "My room", words: {} },
                6: { name: "Animals", words: {} },
                7: { name: "Food", words: {} },
                8: { name: "Hobby", words: {} },
                9: { name: "Time", words: {} },
                10: { name: "Days of the week", words: {} },
                11: { name: "Weather", words: {} },
                12: { name: "Clothes", words: {} },
                13: { name: "House", words: {} },
                14: { name: "Town", words: {} },
                15: { name: "Review", words: {} }
            },
            book2: {
                1: { name: "School", words: {
                    "dear": "kallis, armas", "lovely": "armas", "mate": "kaaslane", "over": "läbi, möödas", "again": "jälle",
                    "What's the English (word) for ...?": "Kuidas on inglise keeles ...?", "Swedish": "rootsi keel; rootslane", "classmate": "klassikaaslane",
                    "take": "viima", "Sweden": "Rootsi", "English": "inglane; inglise keel", "language": "keel", "funny": "naljakas",
                    "Finnish": "soome keel; soomlane", "French": "prantsuse keel; prantslane", "turn on": "sisse lülitama", "turn off": "välja lülitama",
                    "light": "valgus, valgustus, tuli; hele", "leave": "jätma; lahkuma", "tomorrow": "homme", "puppy": "kutsikas", "kitten": "kassipoeg",
                    "kind to sb": "lahke kellegi vastu", "car boot": "auto pagasiruum", "twin": "kaksik", "hair clip": "juukseklambr", "textbook": "õpik"
                }},
                2: { name: "Numbers", words: {
                    "them": "neid", "all": "kõik", "bad": "halb", "especially": "eriti", "test": "kontrolltöö", "lucky": "õnnelik, õnnetoov",
                    "tell": "ütlema; siin: saladust reetma", "secret": "saladus; salajane, sala-", "why": "miks", "may": "võima, tohtima",
                    "lose": "kaotama", "its": "selle oma (eluta olendi puhul)", "magic": "nõidus, maagia", "guess": "ära arvama", "thirty": "kolmkümmend",
                    "forty": "nelikümmend", "fifty": "viiskümmend", "sixty": "kuuskümmend", "seventy": "seitsekümmend", "eighty": "kaheksakümmend",
                    "ninety": "üheksakümmend", "hundred": "sada", "afternoon": "pärastlõuna", "in the afternoon": "pärastlõunal", "hold": "hoidma; pidama",
                    "Hold on!": "Oota!", "post": "postitama", "address": "aadress", "laptop": "sülearvuti", "love": "armastama", "paper": "paber",
                    "remember": "mäletama", "swan": "luik", "station": "jaam", "road": "tee; maantee", "helpful": "abivalmis", "same": "sama",
                    "bigger": "suurem", "smaller": "väiksem", "than": "kui (võrdluses)", "circle": "ring", "make up": "moodustama"
                }},
                3: { name: "My day", words: {} },
                4: { name: "Food and drink", words: {} },
                5: { name: "At home", words: {} },
                6: { name: "Hobbies", words: {} },
                7: { name: "Free time", words: {} },
                8: { name: "Animals", words: {} },
                9: { name: "Town and country", words: {} },
                10: { name: "Clothes", words: {} },
                11: { name: "Weather and seasons", words: {} },
                12: { name: "Health", words: {} },
                13: { name: "Travel", words: {} },
                14: { name: "Holidays", words: {} },
                15: { name: "Jobs", words: {} },
                16: { name: "Technology", words: {} },
                17: { name: "Space", words: {} },
                18: { name: "Environment", words: {} },
                19: { name: "Culture", words: {} },
                20: { name: "Review", words: {} }
            }
        };

        let currentWords = [];
        let remainingWords = [];
        let currentPair = {};
        let score = 0;
        let total = 0;
        let mode = 'write';
        let direction = 'en-et';
        let currentChoices = [];

        function updateUnitOptions() {
            let bookKey = document.getElementById('book-select').value;
            let unitSelect = document.getElementById('unit-select');
            unitSelect.innerHTML = '<option value="all">Kõik unitid koos</option>';
            
            let units = CURRICULUM[bookKey];
            for (let uNum in units) {
                let opt = document.createElement('option');
                opt.value = uNum;
                opt.innerText = `Unit ${uNum}: ${units[uNum].name}`;
                unitSelect.appendChild(opt);
            }
        }
        updateUnitOptions();

        function startTest(selectedMode) {
            mode = selectedMode;
            direction = document.getElementById('direction-select').value;
            let bookKey = document.getElementById('book-select').value;
            let unitVal = document.getElementById('unit-select').value;
            
            let sourceDict = {};
            if (unitVal === 'all') {
                for (let u in CURRICULUM[bookKey]) {
                    Object.assign(sourceDict, CURRICULUM[bookKey][u].words);
                }
            } else {
                sourceDict = CURRICULUM[bookKey][unitVal].words || {};
            }

            currentWords = Object.entries(sourceDict);
            if (currentWords.length === 0) {
                alert("Valitud unitis pole sõnu! (Lisa sõnad CURRICULUM objekti sisse).");
                return;
            }

            remainingWords = [...currentWords];
            shuffleArray(remainingWords);

            score = 0;
            total = 0;
            document.getElementById('menu-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');

            if (mode === 'write') {
                document.getElementById('write-mode').classList.remove('hidden');
                document.getElementById('choice-mode').classList.add('hidden');
                document.getElementById('user-answer').placeholder = direction === 'en-et' ? "Kirjuta eesti keeles..." : "Kirjuta inglise keeles...";
            } else {
                document.getElementById('write-mode').classList.add('hidden');
                document.getElementById('choice-mode').classList.remove('hidden');
            }

            document.getElementById('audio-button').style.display = (direction === 'en-et') ? 'inline' : 'none';

            nextQuestion();
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function nextQuestion() {
            document.getElementById('feedback').innerText = "";
            document.getElementById('user-answer').value = "";
            
            if (remainingWords.length === 0) {
                remainingWords = [...currentWords];
                shuffleArray(remainingWords);
            }

            currentPair = remainingWords.pop();
            
            let questionWord = direction === 'en-et' ? currentPair[0] : currentPair[1];
            let targetLangText = direction === 'en-et' ? "eesti keeles" : "inglise keeles";
            
            document.getElementById('question-text').innerText = `Mis on ${targetLangText} sõna: "${questionWord}"?`;
            document.getElementById('score').innerText = score;
            document.getElementById('total').innerText = total;

            if (mode === 'choice') {
                setupChoices();
            } else {
                document.getElementById('user-answer').focus();
            }
        }

        function setupChoices() {
            let correctAns = direction === 'en-et' ? currentPair[1] : currentPair[0];
            currentChoices = [correctAns];

            while (currentChoices.length < 4 && currentChoices.length < currentWords.length) {
                let randomPair = currentWords[Math.floor(Math.random() * currentWords.length)];
                let wrongAns = direction === 'en-et' ? randomPair[1] : randomPair[0];
                if (!currentChoices.includes(wrongAns)) {
                    currentChoices.push(wrongAns);
                }
            }
            currentChoices.sort(() => Math.random() - 0.5);

            for (let i = 0; i < 4; i++) {
                let btn = document.getElementById(`opt${i}`);
                if (currentChoices[i]) {
                    btn.innerText = currentChoices[i];
                    btn.style.display = "block";
                } else {
                    btn.style.display = "none";
                }
            }
        }

        function checkWrittenAnswer() {
            let userAns = document.getElementById('user-answer').value.trim().toLowerCase();
            let correctAns = (direction === 'en-et' ? currentPair[1] : currentPair[0]).toLowerCase();

            total++;
            if (userAns === correctAns) {
                score++;
                document.getElementById('feedback').style.color = "green";
                document.getElementById('feedback').innerText = "Õige! 🎉";
                setTimeout(nextQuestion, 1200);
            } else {
                document.getElementById('feedback').style.color = "red";
                let properCorrect = direction === 'en-et' ? currentPair[1] : currentPair[0];
                document.getElementById('feedback').innerText = `Vale! Õige vastus oli: ${properCorrect}`;
                setTimeout(nextQuestion, 2000);
            }
        }

        function checkChoiceAnswer(index) {
            let chosenAns = currentChoices[index];
            let correctAns = direction === 'en-et' ? currentPair[1] : currentPair[0];
            total++;

            if (chosenAns === correctAns) {
                score++;
                document.getElementById('feedback').style.color = "green";
                document.getElementById('feedback').innerText = "Õige! 🎉";
                setTimeout(nextQuestion, 1200);
            } else {
                document.getElementById('feedback').style.color = "red";
                document.getElementById('feedback').innerText = `Vale! Õige vastus oli: ${correctAns}`;
                setTimeout(nextQuestion, 2000);
            }
        }

        document.getElementById('user-answer').addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                checkWrittenAnswer();
            }
        });

        function speakCurrentWord() {
            if (!currentPair[0]) return;
            let utterance = new SpeechSynthesisUtterance(currentPair[0]);
            utterance.lang = 'en-GB';
            window.speechSynthesis.speak(utterance);
        }

        function endTest() {
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
            let percentage = total > 0 ? Math.round((score / total) * 100) : 0;
            document.getElementById('final-stats').innerText = `Said ${score} õiget vastust ${total} küsimusest. Tulemus: ${percentage}%`;
        }

        function openPrintView() {
            let bookKey = document.getElementById('book-select').value;
            let unitVal = document.getElementById('unit-select').value;
            direction = document.getElementById('direction-select').value;
            
            let bookName = bookKey === 'book1' ? 'Book 1' : 'Book 2';
            let unitText = unitVal === 'all' ? 'Kõik unitid' : `Unit ${unitVal}: ${CURRICULUM[bookKey][unitVal].name}`;
            let dirText = direction === 'en-et' ? 'Inglise ➔ Eesti' : 'Eesti ➔ Inglise';
            document.getElementById('print-title').innerText = `Sõnade Tööleht (${bookName} - ${unitText} | ${dirText})`;

            let sourceDict = {};
            if (unitVal === 'all') {
                for (let u in CURRICULUM[bookKey]) {
                    Object.assign(sourceDict, CURRICULUM[bookKey][u].words);
                }
            } else {
                sourceDict = CURRICULUM[bookKey][unitVal].words || {};
            }

            let col1Title = direction === 'en-et' ? 'Inglise keel' : 'Eesti keel';
            let col2Title = direction === 'en-et' ? 'Eesti keel (kirjuta siia)' : 'Inglise keel (kirjuta siia)';

            let html = `<table class="print-table"><thead><tr><th>${col1Title}</th><th>${col2Title}</th></tr></thead><tbody>`;
            for (let [eng, est] of Object.entries(sourceDict)) {
                let questionWord = direction === 'en-et' ? eng : est;
                html += `<tr><td><strong>${questionWord}</strong></td><td class="write-cell"></td></tr>`;
            }
            html += `</tbody></table>`;

            document.getElementById('print-content').innerHTML = html;
            window.print();
        }
    </script>
</body>
</html>
